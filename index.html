<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Doramas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <video autoplay muted loop playsinline id="background-video">
        <!-- SUBSTITUA 'video/background-animation.mp4' pelo caminho do seu vídeo -->
        <source src="img/videos/mamae.mp4" type="video/mp4">
        Seu navegador não suporta vídeos HTML5.
    </video>
    <audio id="background-music" loop preload="auto">
        <!-- SUBSTITUA 'audio/theme.mp3' pelo caminho da sua música -->
        <source src="audio/ost/alovesobeautiful.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio HTML5.
    </audio>
    <div class="container">
        <h1> K-Quiz Mania </h1>

        <!-- Menu Inicial -->
        <div id="menu-inicial" class="visible">
            <h2>Escolha uma Categoria:</h2>
            <button class="btn-categoria" data-categoria="cena">Adivinhe o Dorama pela Cena</button>
            <button class="btn-categoria" data-categoria="ator">Reconheça o Ator/Atriz</button>
            <button class="btn-categoria" data-categoria="ost">Trilha Sonora Misteriosa</button>

            <div id="music-controls">
                <button id="music-toggle-btn" class="music-btn">
                    <i class="fas fa-pause"></i> <!-- Ícone inicial: Pausa -->
                </button>
                <i class="fas fa-volume-down music-icon"></i> <!-- Ícone de volume baixo -->
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5"> <!-- Slider 0 a 1 -->
                 <i class="fas fa-volume-up music-icon"></i> <!-- Ícone de volume alto -->
            </div>
        </div>

        <!-- Container do Quiz -->
        <div id="quiz-container" class="hidden">
            <div id="pergunta-info">
                <span id="categoria-atual"></span>
                <span id="timer-display">Tempo: <span id="time-left">--</span>s</span>
                <span id="progresso">Pergunta X de 10</span>
            </div>
            <h3 id="pergunta-texto">Carregando pergunta...</h3>

            <div id="midia-container">
                <img id="imagem-pergunta" src="" alt="Imagem da pergunta" class="hidden">
                <audio id="audio-pergunta" controls class="hidden"></audio>
            </div>

            <div id="opcoes-container">
                <!-- Botões de opção serão gerados aqui -->
            </div>

            <div id="feedback" class="feedback-message"></div>

            <button id="proxima-btn" class="btn hidden">Próxima Pergunta</button>
        </div>

        <!-- Container de Resultados -->
        <div id="resultado-container" class="hidden">
            <h2>Quiz Finalizado!</h2>
            <p id="pontuacao-final">Sua pontuação: X de 10</p>
            <button id="reiniciar-btn" class="btn">Jogar Novamente</button>
        </div>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
